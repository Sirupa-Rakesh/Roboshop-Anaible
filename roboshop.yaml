- name: create ec2 and r53 record
  hosts: all
  connection: local

  vars:
    sg_id: sg-08f36e4129a352630
    ami_id: ami-0220d79f3f480ecf5
    domain_name: rakeshdev.online
    env: dev
    instances:
      - mongodb
      - catalogue

  tasks:

    - name: create ec2 instances
      amazon.aws.ec2_instance:
        instance_type: t3.micro
        security_group_ids: "{{ sg_id }}"
        image_id: "{{ ami_id }}"
        name: "{{ item }}-{{ env }}"
      loop: "{{ instances }}"
      register: ec2_output

    - name: print the output
      ansible.builtin.debug:
        msg: "{{ ec2_output }}"

    - name: create r53 record
      amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ item.item }}-{{ env }}.{{ domain_name }}"
        type: A
        ttl: 1
        value: "{{ item.instances[0].private_ip_address }}"
        wait: true
      loop: "{{ ec2_output.results }}"
