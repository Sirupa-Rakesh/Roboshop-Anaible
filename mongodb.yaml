- name: create ec2 instance and r53 reocord
  hosts: local
  connection: local
  vars:
    security_group: sg-08f36e4129a352630
    ami_id: ami-0220d79f3f480ecf5
    env: dev
    instances: 
    - mongodb
    - catalogue
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      security_group: "{{ security_group }}"
      image_id: "{{ ami_id }}"
      name: "{{ item }}-{{ env }}"
      tags: 
        Project: roboshop
        Component: "{{ item }}"
        Env: "{{ env }}"
        Name: "{{ item }}-{{ env }}"
    loop: "{{ instances }}"
    register: ec2_output


  - name: print the output
    ansible.builtin.debug:
      msg: "{{ ec2_output }}"
